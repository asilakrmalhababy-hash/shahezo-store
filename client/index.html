      <div style="padding:12px 14px;background:#fdf9f4;border-bottom:1px solid #ece2d8;display:flex;align-items:center;justify-content:space-between">

  <!-- SHAHEZO_OFFLINE_GUARD_START -->
<style>
  #shahezo-offline-bar{position:fixed!important;top:10px!important;left:50%!important;transform:translateX(-50%) translateY(-180%)!important;z-index:2147483647!important;width:calc(100vw - 24px)!important;max-width:410px!important;height:44px!important;background:linear-gradient(135deg,#870210 0%,#5e010b 100%)!important;color:#fff!important;border:1.5px solid #e86c12!important;border-radius:12px!important;padding:0 12px!important;box-shadow:0 8px 24px rgba(0,0,0,0.35)!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px!important;font-family:system-ui,Tahoma,sans-serif!important;direction:rtl!important;transition:transform 0.3s ease,opacity 0.25s ease!important;opacity:0!important;pointer-events:none!important;}
  #shahezo-offline-bar.show{transform:translateX(-50%) translateY(0)!important;opacity:1!important;pointer-events:auto!important;}
  #shahezo-offline-bar button{background:#e86c12!important;color:#fff!important;border:none!important;border-radius:8px!important;padding:5px 10px!important;font-size:11.5px!important;font-weight:800!important;cursor:pointer!important;white-space:nowrap!important;}
</style>
<script>
(function(){
  var bar=null;
  function showBar(t){if(!bar&&document.body){bar=document.createElement("div");bar.id="shahezo-offline-bar";bar.innerHTML="<span style='font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'></span><button type='button'>إعادة المحاولة</button>";bar.querySelector("button").onclick=retry;document.body.appendChild(bar);}if(bar){bar.querySelector("span").textContent=t;bar.classList.add("show");}}
  function hideBar(){if(bar)bar.classList.remove("show");}
  function retry(){var imgs=document.querySelectorAll("img[data-sh-fail='1']");if(!navigator.onLine){showBar("📡 لا يوجد لديك إنترنت حالياً");return;}hideBar();imgs.forEach(function(im){var o=im.getAttribute("data-sh-src");if(o){im.removeAttribute("data-sh-fail");im.src=o+(o.indexOf("?")===-1?"?":"&")+"_r="+Date.now();}});}
  window.addEventListener("error",function(ev){var im=ev.target;if(!im||im.tagName!=="IMG")return;var s=im.getAttribute("src")||"";if(s.indexOf("data:image/svg")===0)return;im.setAttribute("data-sh-src",s);im.setAttribute("data-sh-fail","1");var title=(im.getAttribute("alt")||"بوفية شهيزو").slice(0,22).replace(/[<>&"]/g,"");var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 320' dir='rtl'><rect width='320' height='320' rx='18' fill='#870210'/><rect x='10' y='10' width='300' height='300' rx='14' fill='none' stroke='#e86c12' stroke-opacity='0.45' stroke-width='2'/><text x='160' y='145' text-anchor='middle' fill='#fff' font-family='Tahoma,sans-serif' font-size='20' font-weight='800'>"+title+"</text><rect x='65' y='185' width='190' height='34' rx='17' fill='#e86c12'/><text x='160' y='207' text-anchor='middle' fill='#fff' font-family='Tahoma,sans-serif' font-size='13' font-weight='800'>لا يوجد لديك إنترنت</text></svg>";im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);showBar("📡 لا يوجد لديك إنترنت حالياً");},true);
  window.addEventListener("offline",function(){showBar("📡 انقطع الاتصال بالإنترنت");});
  window.addEventListener("online",retry);
})();
</script>
<!-- SHAHEZO_OFFLINE_GUARD_END -->
